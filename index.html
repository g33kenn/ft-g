<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Daily Food Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; /* gray-800 */
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; /* gray-600 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* gray-500 */
        }
        .food-item {
            display: inline-block;
            background-color: #3730a3; /* indigo-800 */
            color: #c7d2fe; /* indigo-200 */
            padding: 2px 8px;
            border-radius: 9999px;
            margin: 2px;
            font-size: 0.875rem;
        }
        .modal-overlay {
            transition: opacity 0.3s ease;
        }
        .modal-container {
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <div id="app-container" class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Login View -->
        <div id="login-view" class="text-center py-16">
            <h1 class="text-4xl font-bold text-indigo-400">Food Tracker</h1>
            <p class="text-gray-400 mt-2 mb-8">Please sign in to continue.</p>
            <button id="login-btn" class="bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition transform hover:scale-105 inline-flex items-center">
                <svg class="w-6 h-6 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.222,0-9.657-3.356-11.303-8H6.306C9.656,39.663,16.318,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.574l6.19,5.238C39.904,36.218,44,30.668,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                Sign in with Google
            </button>
        </div>

        <!-- Main App View -->
        <div id="main-app-view" class="hidden">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-4xl font-bold text-indigo-400">Food Tracker</h1>
                    <p id="user-email" class="text-gray-400 mt-2"></p>
                </div>
                <button id="logout-btn" class="bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-red-700">Logout</button>
            </header>

            <!-- Form for adding new entries -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-md mb-8 border border-gray-700">
                <h2 class="text-2xl font-semibold mb-4 text-gray-100">Add New Entry</h2>
                <form id="food-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-1">
                        <label for="entry-date" class="block text-sm font-medium text-gray-400 mb-1">Date</label>
                        <input type="date" id="entry-date" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    </div>
                    <div class="md:col-span-2">
                        <label for="food-items" class="block text-sm font-medium text-gray-400 mb-1">Food (one item per line)</label>
                        <textarea id="food-items" rows="4" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="e.g.,&#10;Oatmeal with berries&#10;Grilled chicken salad&#10;..."></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label for="notes" class="block text-sm font-medium text-gray-400 mb-1">Notes</label>
                        <textarea id="notes" rows="2" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition" placeholder="Any additional details..."></textarea>
                    </div>
                    <div class="md:col-span-2 text-right">
                        <button type="submit" class="bg-indigo-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition transform hover:scale-105">
                            Add Log Entry
                        </button>
                    </div>
                </form>
            </div>
            
            <div id="log-container" class="space-y-6"></div>
            <div id="loading-indicator" class="text-center py-8">
                <p class="text-gray-400">Waiting for data...</p>
            </div>
        </div>
    </div>

    <!-- Modals (Edit and Delete) -->
    <div id="edit-modal" class="fixed inset-0 z-40 hidden items-center justify-center">
        <div id="edit-modal-overlay" class="absolute inset-0 bg-black opacity-70 modal-overlay"></div>
        <div class="modal-container bg-gray-800 w-11/12 md:max-w-md mx-auto rounded-xl shadow-lg z-50 overflow-y-auto transform scale-95 border border-gray-700">
            <div class="p-6">
                <h3 class="text-2xl font-semibold mb-4 text-gray-100">Edit Entry</h3>
                <form id="edit-form">
                    <input type="hidden" id="edit-entry-id">
                    <div class="mb-4">
                        <label for="edit-entry-date" class="block text-sm font-medium text-gray-400 mb-1">Date</label>
                        <input type="date" id="edit-entry-date" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="mb-4">
                        <label for="edit-food-items" class="block text-sm font-medium text-gray-400 mb-1">Food</label>
                        <textarea id="edit-food-items" rows="5" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="edit-notes" class="block text-sm font-medium text-gray-400 mb-1">Notes</label>
                        <textarea id="edit-notes" rows="3" class="w-full p-3 bg-gray-700 border border-gray-600 text-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>
                    <div class="flex justify-end gap-4">
                        <button type="button" id="cancel-edit-btn" class="bg-gray-600 text-gray-200 font-semibold py-2 px-4 rounded-lg hover:bg-gray-500">Cancel</button>
                        <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="delete-modal" class="fixed inset-0 z-40 hidden items-center justify-center">
        <div id="delete-modal-overlay" class="absolute inset-0 bg-black opacity-70 modal-overlay"></div>
        <div class="modal-container bg-gray-800 w-11/12 md:max-w-sm mx-auto rounded-xl shadow-lg z-50 transform scale-95 border border-gray-700">
            <div class="p-6 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 mx-auto text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <h3 class="text-xl font-semibold mt-4 mb-2 text-gray-100">Delete Entry?</h3>
                <p class="text-gray-400 mb-6">Are you sure you want to delete this entry? This action cannot be undone.</p>
                <div class="flex justify-center gap-4">
                    <button id="cancel-delete-btn" class="bg-gray-600 text-gray-200 font-semibold py-2 px-6 rounded-lg hover:bg-gray-500">Cancel</button>
                    <button id="confirm-delete-btn" class="bg-red-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-red-700">Delete</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Message box for notifications -->
    <div id="message-box" class="hidden fixed top-5 right-5 bg-green-500 text-white py-2 px-4 rounded-lg shadow-lg transition-opacity duration-300 z-50"></div>

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ===================================================================================
        // PASTE YOUR FIREBASE CONFIGURATION OBJECT HERE
        // ===================================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyBYjXe6Of9wadcO-Yaw47xaeo9jh1bnQ7E",
          authDomain: "foodtracker-e22a4.firebaseapp.com",
          projectId: "foodtracker-e22a4",
          storageBucket: "foodtracker-e22a4.firebasestorage.app",
          messagingSenderId: "144722131355",
          appId: "1:144722131355:web:eb23484a8e953ba8ac493e"
        };
        // ===================================================================================

        // --- Initialize Firebase ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let foodEntriesCollection;
        let localEntries = [];
        let docIdToDelete = null;
        let unsubscribe; // To store the snapshot listener and detach it on logout

        // --- DOM Elements ---
        const loginView = document.getElementById('login-view');
        const mainAppView = document.getElementById('main-app-view');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email');
        const foodForm = document.getElementById('food-form');
        const entryDateInput = document.getElementById('entry-date');
        const foodItemsInput = document.getElementById('food-items');
        const notesInput = document.getElementById('notes');
        const logContainer = document.getElementById('log-container');
        const loadingIndicator = document.getElementById('loading-indicator');
        const messageBox = document.getElementById('message-box');
        
        // Modal Elements
        const editModal = document.getElementById('edit-modal');
        const editModalOverlay = document.getElementById('edit-modal-overlay');
        const editForm = document.getElementById('edit-form');
        const editEntryIdInput = document.getElementById('edit-entry-id');
        const editEntryDateInput = document.getElementById('edit-entry-date');
        const editFoodItemsInput = document.getElementById('edit-food-items');
        const editNotesInput = document.getElementById('edit-notes');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalOverlay = document.getElementById('delete-modal-overlay');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        // --- Functions ---
        function showMessage(message, isError = false) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-green-500', 'bg-red-500');
            messageBox.classList.add(isError ? 'bg-red-500' : 'bg-green-500');
            setTimeout(() => { messageBox.classList.add('hidden'); }, 3000);
        }

        function renderEntries(entries) {
            localEntries = entries;
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            logContainer.innerHTML = '';
            if (entries.length === 0) {
                logContainer.innerHTML = `<div class="text-center py-8 bg-gray-800 rounded-lg shadow-md border border-gray-700"><p class="text-gray-400">No food logs yet. Add one above to get started!</p></div>`;
            } else {
                entries.forEach(entry => {
                    const card = document.createElement('div');
                    card.className = 'bg-gray-800 p-6 rounded-xl shadow-md border border-gray-700';
                    const formattedDate = new Date(entry.date + 'T00:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    const foodItemsHTML = entry.food.split('\n').filter(item => item.trim() !== '').map(item => `<span class="food-item">${item.trim()}</span>`).join('');
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <p class="text-lg font-bold text-indigo-400">${formattedDate}</p>
                            <div class="flex items-center gap-2">
                                <button data-id="${entry.id}" class="edit-btn text-gray-400 hover:text-indigo-400 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L16.732 3.732z" /></svg>
                                </button>
                                <button data-id="${entry.id}" class="delete-btn text-gray-400 hover:text-red-500 transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                </button>
                            </div>
                        </div>
                        <div class="mt-4">
                            <h3 class="font-semibold text-gray-300 mb-2">Food</h3>
                            <div class="flex flex-wrap gap-2">${foodItemsHTML}</div>
                        </div>
                        ${entry.notes ? `<div class="mt-4"><h3 class="font-semibold text-gray-300">Notes</h3><p class="text-gray-300 bg-gray-700 p-3 rounded-lg">${entry.notes}</p></div>` : ''}
                    `;
                    logContainer.appendChild(card);
                });
            }
            loadingIndicator.classList.add('hidden');
        }

        function setupEntryListener(userId) {
            const collectionPath = `users/${userId}/food_entries`;
            foodEntriesCollection = collection(db, collectionPath);
            unsubscribe = onSnapshot(foodEntriesCollection, (snapshot) => {
                const entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderEntries(entries);
            }, (error) => {
                console.error("Error fetching entries: ", error);
                showMessage("Could not fetch entries. Please refresh.", true);
            });
        }

        function showModal(modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
        function hideModal(modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        
        // --- Auth Listeners ---
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Google Sign-In Error:", error);
                showMessage("Could not sign in with Google. Please try again.", true);
            });
        });

        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // --- Main App Logic ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                loginView.classList.add('hidden');
                mainAppView.classList.remove('hidden');
                userEmailDisplay.textContent = `Logged in as ${user.email}`;
                if (unsubscribe) unsubscribe(); // Detach any old listener
                setupEntryListener(user.uid);
            } else {
                // User is signed out
                mainAppView.classList.add('hidden');
                loginView.classList.remove('hidden');
                if (unsubscribe) unsubscribe(); // Detach listener on logout
                logContainer.innerHTML = '';
                loadingIndicator.classList.add('hidden');
            }
        });

        // --- Event Listeners for App ---
        foodForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = entryDateInput.value;
            const food = foodItemsInput.value;
            const notes = notesInput.value;
            if (!date || !food.trim()) {
                showMessage("Date and Food fields are required.", true);
                return;
            }
            try {
                await addDoc(foodEntriesCollection, { date, food, notes });
                showMessage("Entry added successfully!", false);
                foodForm.reset();
                entryDateInput.value = new Date().toISOString().split('T')[0];
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage("Failed to add entry. Please try again.", true);
            }
        });

        logContainer.addEventListener('click', (e) => {
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const id = editBtn.dataset.id;
                const entry = localEntries.find(e => e.id === id);
                if (entry) {
                    editEntryIdInput.value = entry.id;
                    editEntryDateInput.value = entry.date;
                    editFoodItemsInput.value = entry.food;
                    editNotesInput.value = entry.notes;
                    showModal(editModal);
                }
            }
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                docIdToDelete = deleteBtn.dataset.id;
                showModal(deleteModal);
            }
        });
        
        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = editEntryIdInput.value;
            const updatedEntry = {
                date: editEntryDateInput.value,
                food: editFoodItemsInput.value,
                notes: editNotesInput.value,
            };
            try {
                const docRef = doc(db, foodEntriesCollection.path, id);
                await updateDoc(docRef, updatedEntry);
                showMessage("Entry updated successfully!");
                hideModal(editModal);
            } catch (error) {
                console.error("Error updating document: ", error);
                showMessage("Failed to update entry.", true);
            }
        });
        cancelEditBtn.addEventListener('click', () => hideModal(editModal));
        editModalOverlay.addEventListener('click', () => hideModal(editModal));
        
        confirmDeleteBtn.addEventListener('click', async () => {
            if (docIdToDelete) {
                try {
                    await deleteDoc(doc(db, foodEntriesCollection.path, docIdToDelete));
                    showMessage("Entry deleted.");
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    showMessage("Failed to delete entry.", true);
                } finally {
                    docIdToDelete = null;
                    hideModal(deleteModal);
                }
            }
        });
        cancelDeleteBtn.addEventListener('click', () => hideModal(deleteModal));
        deleteModalOverlay.addEventListener('click', () => hideModal(deleteModal));

        // --- Initialization ---
        entryDateInput.value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
